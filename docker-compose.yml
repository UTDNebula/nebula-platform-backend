services:
  postgres:
    image: postgres:17-alpine
    container_name: nebula-platform-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nebula_platform
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula_dev

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - nebula_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula -d nebula_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nebula_postgres_data: